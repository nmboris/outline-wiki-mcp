version: '3.8'

services:
  outline-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: outline-mcp-server
    restart: unless-stopped
    
    # Environment variables for HTTP mode
    environment:
      # Required: Your Outline instance URL
      - OUTLINE_BASE_URL=${OUTLINE_BASE_URL:-https://your-instance.getoutline.com}
      
      # Transport mode (http for Mistral.ai)
      - MCP_TRANSPORT=${MCP_TRANSPORT:-http}
      
      # HTTP server configuration
      - MCP_PORT=${MCP_PORT:-3000}
      - MCP_PATH=${MCP_PATH:-/mcp}
      
      # Optional: Additional MCP authentication
      # Uncomment if you want extra security layer
      # - MCP_REQUIRE_AUTH=${MCP_REQUIRE_AUTH:-false}
      # - MCP_BEARER_TOKEN=${MCP_BEARER_TOKEN}
      
      # For stdio mode only (not needed for HTTP)
      # - OUTLINE_API_KEY=${OUTLINE_API_KEY}
    
    ports:
      - "${HOST_PORT:-3000}:3000"
    
    # Health check
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false
    
    # Labels for Coolify
    labels:
      - "coolify.managed=true"
      - "coolify.name=outline-mcp-server"
      - "coolify.description=MCP Server for Outline Wiki (Multi-Tenant)"
